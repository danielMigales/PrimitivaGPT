name: Publicar PrimitivaGPT en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Construir artefactos generados y ejecutar pruebas
        run: |
          npm run build
          npm test
      - name: Guardar artefactos generados
        run: |
          git add data/ public/ worker/index.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar artefactos de PrimitivaGPT [skip ci]"
            git push
          else
            echo "No hay cambios generados que guardar."
          fi
      - name: Comprobar que el Worker generado está sincronizado
        run: git diff --exit-code -- worker/index.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar PrimitivaGPT
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Diagnosticar publicación pública
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "URL oficial comunicada por GitHub Pages: $SITE_URL"
          echo "Configuración real de Pages:"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages \
            | tee /tmp/pages-config.json
          echo
          echo "Comprobando respuesta HTTP pública:"
          for attempt in {1..12}; do
            code=$(curl --silent --show-error --output /tmp/site-response.html --write-out "%{http_code}" "$SITE_URL")
            echo "Intento $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              grep -qi "<html" /tmp/site-response.html
              echo "La web responde HTTP 200 y entrega HTML."
              exit 0
            fi
            sleep 10
          done
          echo "La publicación no está accesible públicamente en $SITE_URL"
          head -c 1000 /tmp/site-response.html || true
          exit 1
