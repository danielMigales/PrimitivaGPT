name: Publicar PrimitivaGPT en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hora peninsular española; GitHub ajusta automáticamente el horario de verano.
    - cron: '0 23 * * *'
      timezone: Europe/Madrid
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Actualizar resultados oficiales (bloquear publicación si SELAE falla)
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/update_data.py
      - name: Construir artefactos generados y ejecutar pruebas
        run: |
          npm run build
          npm test
      - name: Guardar datos y artefactos generados
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git add data/ public/ worker/index.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar datos y artefactos de PrimitivaGPT [skip ci]"
            git push
          else
            echo "No hay cambios generados que guardar."
          fi
      - name: Comprobar que el Worker generado está sincronizado
        run: git diff --exit-code -- worker/index.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar PrimitivaGPT
        id: deployment
        uses: actions/deploy-pages@v5
