name: Actualizar SELAE y validar
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: primitiva-publicacion
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descargar y validar histórico oficial
        run: python scripts/update_data.py
      - name: Probar y generar aplicación
        run: |
          npm test
          npm run build
      - name: Conservar resultados en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data worker/index.js public
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar histórico oficial SELAE'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: primitiva-web-estatica
          path: public
