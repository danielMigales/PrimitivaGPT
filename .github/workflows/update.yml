name: Validar PrimitivaGPT
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: primitiva-publicacion
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generar artefactos y probar aplicación
        run: |
          npm run build
          npm test
      - uses: actions/upload-artifact@v7
        with:
          name: primitiva-web-estatica
          path: public
