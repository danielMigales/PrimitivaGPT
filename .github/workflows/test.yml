name: Validar PrimitivaGPT
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Ejecutar pruebas
        run: npm test
      - name: Construir y validar artefactos
        run: npm run build
