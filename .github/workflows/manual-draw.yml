name: Introducir resultado manual de La Primitiva
on:
  workflow_dispatch:
    inputs:
      draw_date:
        description: "Fecha del sorteo (AAAA-MM-DD)"
        required: true
        type: string
      n1:
        description: "Número 1 (1-49)"
        required: true
        type: number
      n2:
        description: "Número 2 (1-49)"
        required: true
        type: number
      n3:
        description: "Número 3 (1-49)"
        required: true
        type: number
      n4:
        description: "Número 4 (1-49)"
        required: true
        type: number
      n5:
        description: "Número 5 (1-49)"
        required: true
        type: number
      n6:
        description: "Número 6 (1-49)"
        required: true
        type: number
      complementary:
        description: "Complementario (1-49, distinto de los seis)"
        required: true
        type: number
      refund:
        description: "Reintegro (0-9)"
        required: true
        type: number
permissions:
  contents: write
concurrency:
  group: primitiva-manual-draw
  cancel-in-progress: false
jobs:
  validate-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validar e incorporar el sorteo
        env:
          DRAW_DATE: ${{ inputs.draw_date }}
          N1: ${{ inputs.n1 }}
          N2: ${{ inputs.n2 }}
          N3: ${{ inputs.n3 }}
          N4: ${{ inputs.n4 }}
          N5: ${{ inputs.n5 }}
          N6: ${{ inputs.n6 }}
          COMPLEMENTARY: ${{ inputs.complementary }}
          REFUND: ${{ inputs.refund }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("data/draws.json")
          archive = json.loads(path.read_text(encoding="utf-8"))
          day = dt.date.fromisoformat(os.environ["DRAW_DATE"])
          today = dt.datetime.now(ZoneInfo("Europe/Madrid")).date()
          if day > today:
              raise SystemExit("ERROR: la fecha del sorteo no puede ser futura.")
          if day.weekday() not in (0, 3, 5):
              raise SystemExit("ERROR: La Primitiva solo sortea lunes, jueves y sábado.")
          numbers = [int(os.environ[f"N{i}"]) for i in range(1, 7)]
          complementary = int(os.environ["COMPLEMENTARY"])
          refund = int(os.environ["REFUND"])
          if len(set(numbers)) != 6 or any(n < 1 or n > 49 for n in numbers):
              raise SystemExit("ERROR: introduce seis números distintos entre 1 y 49.")
          if not 1 <= complementary <= 49 or complementary in numbers:
              raise SystemExit("ERROR: el complementario debe estar entre 1 y 49 y no repetir los seis números.")
          if not 0 <= refund <= 9:
              raise SystemExit("ERROR: el reintegro debe estar entre 0 y 9.")
          draws = archive.get("draws", [])
          if any(row.get("date") == day.isoformat() for row in draws):
              raise SystemExit(f"ERROR: ya existe un sorteo para {day.isoformat()}. No se modificó el histórico.")
          latest = max((row.get("date", "") for row in draws), default="")
          if latest and day.isoformat() <= latest:
              raise SystemExit(f"ERROR: la fecha debe ser posterior al último sorteo guardado ({latest}). No se modificó el histórico.")
          months = {
              1:"enero",2:"febrero",3:"marzo",4:"abril",5:"mayo",6:"junio",
              7:"julio",8:"agosto",9:"septiembre",10:"octubre",11:"noviembre",12:"diciembre"
          }
          source = (
              "https://www.loteriasyapuestas.es/es/la-primitiva/resultados/"
              f"la-primitiva-resultados-del-{day.day}-de-{months[day.month]}-de-{day.year}"
          )
          record = {
              "id": day.strftime("%Y%m%d"),
              "date": day.isoformat(),
              "numbers": sorted(numbers),
              "complementary": complementary,
              "refund": refund,
              "source": source
          }
          draws.append(record)
          draws.sort(key=lambda row: row["date"], reverse=True)
          archive["draws"] = draws
          archive["latestDate"] = draws[0]["date"]
          archive["checkedAt"] = dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          path.write_text(json.dumps(archive, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Sorteo validado: {record['date']} · {record['numbers']} · C({complementary}) · R({refund})")
          PY
      - name: Construir y ejecutar todas las pruebas antes de guardar
        run: |
          npm run build
          npm test
      - name: Guardar únicamente el histórico validado
        run: |
          git add data/draws.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Añadir sorteo manual validado [manual-draw]"
          git push origin HEAD:main
