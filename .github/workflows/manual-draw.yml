name: Guardar sorteo manual de La Primitiva
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      resultado:
        description: 'Fecha: AAAA-MM-DD; Números: 1,2,3,4,5,6; Complementario: 7; Reintegro: 8'
        required: true
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: primitiva-manual-draw
  cancel-in-progress: false
jobs:
  save-draw:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'danielMigales' && startsWith(github.event.issue.title, '[SORTEO MANUAL PRIMITIVA]'))
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar e incorporar el sorteo
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_RESULTADO: ${{ inputs.resultado }}
        run: |
          if [ -n "$ISSUE_BODY" ]; then
            python scripts/import_manual_draw.py
          else
            export ISSUE_BODY="$INPUT_RESULTADO"
            python scripts/import_manual_draw.py
          fi
      - name: Construir y ejecutar pruebas
        run: |
          npm run build
          npm test
      - name: Guardar histórico y artefactos validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/ worker/index.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico y análisis [manual-draw]"
            git push origin HEAD:main
          else
            echo "El sorteo ya estaba incorporado; no hay cambios."
          fi
      - name: Confirmar resultado en la incidencia
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const body = success
              ? ' **Sorteo guardado correctamente.** El histórico y los artefactos se han actualizado; el despliegue de GitHub Pages se inicia automáticamente con el commit.'
              : ' **No se ha guardado el sorteo.** Revisa los registros de esta ejecución.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
