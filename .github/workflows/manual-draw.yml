name: Guardar sorteo manual de La Primitiva
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      resultado:
        description: 'Fecha: AAAA-MM-DD; Números: 1,2,3,4,5,6; Complementario: 7; Reintegro: 8'
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: primitiva-manual-draw
  cancel-in-progress: false
jobs:
  save-draw:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'danielMigales' && startsWith(github.event.issue.title, '[SORTEO MANUAL PRIMITIVA]'))
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar e incorporar el sorteo
        id: save
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_RESULTADO: ${{ inputs.resultado }}
        run: |
          if [ -n "$ISSUE_BODY" ]; then
            python scripts/import_manual_draw.py
          else
            export ISSUE_BODY="$INPUT_RESULTADO"
            python scripts/import_manual_draw.py
          fi
      - name: Construir y ejecutar pruebas
        run: |
          npm ci
          npm run build
          npm test
      - name: Guardar histórico validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --cached --check
          git commit -m "Añadir sorteo manual validado [manual-draw]"
          git push origin HEAD:main
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar web actualizada
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Confirmar resultado en la incidencia
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const body = success
              ? ' **Sorteo guardado correctamente.** El histórico compartido se ha actualizado, se han ejecutado las pruebas y la web se ha publicado.'
              : ' **No se ha guardado el sorteo.** La validación, las pruebas o la publicación han fallado. Revisa los registros de esta ejecución.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
